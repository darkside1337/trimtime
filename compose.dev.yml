services:
  db:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: trimtime_dev
      POSTGRES_PASSWORD: trimtime_dev_only
      POSTGRES_DB: trimtime_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimtime_dev -d trimtime_dev"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  dev-data:
